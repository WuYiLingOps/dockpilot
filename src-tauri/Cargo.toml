[package]
name = "dockpilot"
version = "1.0.5"
description = "轻量级 Docker 桌面管理工具"
authors = ["hj"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：系统托盘（关闭窗口可最小化到托盘后台常驻）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# 编排页选择 compose 文件
tauri-plugin-dialog = "2"# 容器异常（非零退出/OOM/健康检查失败）的系统桌面通知
tauri-plugin-notification = "2"
# 托盘常驻后二次启动只唤起已有窗口，不拉起新实例
tauri-plugin-single-instance = "2"
# 运行日志落盘（fern 内核）：按大小轮转 + KeepSome 自动清理 + 每会话归档；
# 使用日志查看器与崩溃诊断依赖它（要求 Rust ≥ 1.90）
log = "0.4"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ssl：远程 TLS 连接（rustls/ring）；默认 features 已含 http + pipe
bollard = { version = "0.19", features = ["ssl"] }
# 镜像源测速与 registry 连通性测试；tauri 已传递依赖 reqwest，直接声明并统一用 rustls 避免 OpenSSL 构建依赖
# json：/v2/ 探测解析 Bearer token 响应
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
# bollard 的 ssl 走 rustls/ring，reqwest 0.13 的 rustls 走 aws-lc-rs，依赖图同时启用两个
# provider 时 rustls 无法从 features 自动选择；直接依赖 rustls 以便启动时显式安装默认 provider，
# 否则 bollard TLS 建连的 ClientConfig::builder() 会 panic（release 下 panic=abort 直接闪退）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
futures = "0.3"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
# 容器创建时按 shell 规则拆分用户输入的覆盖命令（纯 Rust、零传递依赖）
shell-words = "1"
# 容器文件管理：archive API 的 tar 流解析与上传打包（纯 Rust）
tar = "0.4"
# registry 凭据存储：系统钥匙串（macOS Keychain / Windows 凭据管理器 / Linux Secret Service）
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# 加密文件回退的机器标识（machine-id / MachineGuid / IOPlatformUUID）
machine-uid = "0.5"
# 回退存储的凭据加密（AES-256-GCM，密钥由 machine-uid 派生）
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
# 内置 SSH 引擎（密码认证 + 端口转发 + 远程命令执行），替代对系统 ssh 二进制的依赖
russh = { version = "0.63.3", default-features = false, features = [
    # 加密后端选 ring（对齐 rustls 的 ring provider）：默认的 aws-lc-rs 虽已随 reqwest
    # 在依赖图中，但 russh 自身的加解密走 ring 可少编译一份 aws-lc-rs 符号，且与
    # conn.rs 回归测试锁定的 provider 选择策略一致
    "ring",
    "flate2",
    "rsa",
] }

# Windows 原生 DWM 窗口圆角（版本与 tauri 依赖对齐，避免重复编译）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
# NSIS 卸载项检测：纯注册表 API 替代 reg 子进程（GUI 进程 spawn reg.exe 会闪控制台黑框）
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 文件管理集成测试需要 mock AppHandle（管理 Streams 状态）；仅测试构建启用
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
