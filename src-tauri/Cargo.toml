[package]
name = "dockpilot"
version = "0.2.0"
description = "轻量级 Docker 桌面管理工具"
authors = ["hj"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 编排页选择 compose 文件
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = "0.19"
# 镜像源测速；tauri 已传递依赖 reqwest，直接声明并统一用 rustls 避免 OpenSSL 构建依赖
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
futures = "0.3"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
# 容器创建时按 shell 规则拆分用户输入的覆盖命令（纯 Rust、零传递依赖）
shell-words = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
