name: CI

# 提交与 PR 的质量门禁：前端类型检查 + vitest，Rust 格式/clippy/测试。
# 发版验证由 release.yml 承担，本流水线保证 main 分支随时可发。
# 纯文档 / 设计资源改动不触发（代码未变时验证无意义）；手动触发不受此限
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
      - "screenshots/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
      - "screenshots/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（tsc + vitest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 锁文件使用公共 npm registry，避免 CI 依赖本地内网镜像（与 release.yml 一致）
      - name: 安装 Node 依赖
        run: npm ci --include=dev --registry=https://registry.npmjs.org/

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 单元测试
        run: npm test

  rust:
    name: Rust（fmt + clippy + test）
    # ubuntu-22.04 与 release.yml 的 Linux 构建矩阵一致；集成测试依赖本机
    # Docker daemon，Windows 无本地 daemon 且用例仅 unix 编译，故不设 Windows job
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux 构建的系统依赖（编译 src-tauri 需要，与 release.yml 一致）
      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 缓存 Cargo 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # runner 用户默认在 docker 组；个别 runner 镜像 socket 权限收紧时兜底放开，
      # 供 docker/mod.rs 中依赖本机 daemon 的集成测试直连
      - name: 放开 docker socket 权限
        run: sudo chmod 666 /var/run/docker.sock || true

      # 容器创建类集成测试假设本机已有 busybox:stable（与作者日常环境一致），
      # runner 为干净环境需预拉取；镜像存于作者阿里云 ACR 公开仓库（匿名可拉）
      - name: 预拉取测试镜像
        run: |
          docker pull registry.cn-hangzhou.aliyuncs.com/wylhub/busybox:latest
          docker tag registry.cn-hangzhou.aliyuncs.com/wylhub/busybox:latest busybox:stable

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # deprecated 警告为 bollard 0.19 旧 API 的迁移提示（query_parameters 重构），
      # 属独立技术债，清零前显式豁免；其余警告一律按错误处理
      - name: clippy 检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A deprecated

      # 单测 + 本机 daemon 集成测试（远程 SSH 用例已标 #[ignore] 不在此跑）。
      # 集成测试共享同一个真实 daemon：容器创建类用例并行执行时，
      # "两次采样口径一致"类断言（host_stats vs info、system df vs info）
      # 会产生竞态，故强制串行；全部测试仅数秒，无时长影响
      - name: 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
